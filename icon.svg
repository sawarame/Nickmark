<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 背景タイルのグラデーション（深みのあるチャコールスレート） -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#272b33" />
      <stop offset="100%" stop-color="#15181e" />
    </linearGradient>

    <!-- 背景タイルの微細なエッジハイライト（ダークテーマ上での輪郭視認性を確保） -->
    <linearGradient id="bgBorder" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- 背景タイルの角丸クリップ領域 -->
    <clipPath id="tileClip">
      <rect width="256" height="256" rx="54" />
    </clipPath>

    <!-- ブックマークリボンのグラデーション（PrimeVue Aura エメラルドグリーン） -->
    <linearGradient id="ribbonGrad" x1="184" y1="0" x2="184" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="55%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Nキー側面の連続曲面シェーディング（母線に直交する軸でコーナーを滑らかに遷移） -->
    <linearGradient id="bodyGradN" x1="15.95" y1="185.74" x2="146.12" y2="167.59" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8eef5" />
      <stop offset="5.8%" stop-color="#d8e1ec" />
      <stop offset="55.5%" stop-color="#cbd5e1" />
      <stop offset="72.9%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#7c8ba1" />
    </linearGradient>

    <!-- Mキー側面の連続曲面シェーディング（母線に直交する軸でコーナーを滑らかに遷移） -->
    <linearGradient id="bodyGradM" x1="125.37" y1="219.47" x2="255.53" y2="201.32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8eef5" />
      <stop offset="5.8%" stop-color="#d8e1ec" />
      <stop offset="55.5%" stop-color="#cbd5e1" />
      <stop offset="72.9%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#7c8ba1" />
    </linearGradient>

    <!-- キートップ上面のディッシュグラデーション -->
    <linearGradient id="keyTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tileClip)">
    <!-- 背景の角丸スクエアタイル -->
    <rect width="256" height="256" rx="54" fill="url(#bgGrad)" />

    <!-- ブックマークリボン（しおり）のドロップシャドウ -->
    <path d="M 165,0 L 203,0 L 203,64 C 203,66.2 200.5,67.4 198.8,66.0 L 184,53.5 L 169.2,66.0 C 167.5,67.4 165,66.2 165,64 Z" fill="#000000" opacity="0.34" transform="translate(0, 4)" />

    <!-- ブックマークリボン（しおり本体） -->
    <path d="M 165,0 L 203,0 L 203,62 C 203,64.2 200.5,65.4 198.8,64.0 L 184,51.5 L 169.2,64.0 C 167.5,65.4 165,64.2 165,62 Z" fill="url(#ribbonGrad)" />
    <!-- リボン上端の微細な折り返しシェード -->
    <rect x="165" y="0" width="38" height="4" fill="#064e3b" opacity="0.22" />

    <!-- 左奥：「N」キーキャップ -->
    <g>
      <path d="M 112.30,178.28 C 108.35,186.12 97.03,189.98 87.01,186.89 L 18.16,165.66 C 8.14,162.57 3.22,153.71 7.16,145.87 L 34.28,91.99 C 38.23,84.15 49.55,80.29 59.57,83.38 L 128.42,104.61 C 138.44,107.70 143.37,116.56 139.42,124.40 Z" fill="#05070b" opacity="0.28" />
      <path d="M 110.79,173.65 C 107.15,180.89 96.70,184.44 87.45,181.59 L 18.97,160.48 C 9.72,157.63 5.17,149.45 8.82,142.21 L 35.79,88.62 C 39.44,81.38 49.89,77.83 59.14,80.68 L 127.62,101.79 C 136.86,104.64 141.41,112.82 137.77,120.06 Z" fill="#05070b" opacity="0.50" />
      <path d="M 17.96,114.36 C 15.68,120.04 19.40,126.13 26.48,128.32 L 86.02,146.67 C 93.47,148.97 101.89,146.10 104.83,140.27 L 128.28,93.67 C 129.63,91.00 129.63,88.04 128.29,85.37 L 137.10,102.95 C 138.67,106.08 138.67,109.55 137.09,112.68 L 109.97,166.56 C 106.53,173.40 96.66,176.76 87.93,174.07 L 19.07,152.84 C 10.78,150.28 6.41,143.14 9.09,136.48 Z" fill="url(#bodyGradN)" />
      <path d="M 104.83,140.27 C 101.89,146.10 93.47,148.97 86.02,146.67 L 26.48,128.32 C 19.02,126.02 15.36,119.43 18.30,113.60 L 41.76,67.00 C 44.69,61.17 53.11,58.30 60.56,60.60 L 120.11,78.95 C 127.56,81.25 131.22,87.84 128.28,93.67 Z" fill="url(#keyTopGrad)" stroke="#ffffff" stroke-width="1.5" />
      <!-- N の刻印（キートップ平面へアイソメトリック投影） -->
      <g transform="matrix(0.9304, 0.2868, -0.3665, 0.7282, 73.29, 103.63)">
        <path d="M -15.0,19.2 L -15.0,-19.2 L 15.0,19.2 L 15.0,-19.2" fill="none" stroke="#151921" stroke-width="10.4" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 右手前：「M」キーキャップ -->
    <g>
      <path d="M 221.72,212.01 C 217.77,219.85 206.45,223.71 196.43,220.62 L 127.58,199.39 C 117.56,196.30 112.63,187.44 116.58,179.60 L 143.70,125.72 C 147.65,117.88 158.97,114.02 168.99,117.11 L 237.84,138.34 C 247.86,141.43 252.78,150.29 248.84,158.13 Z" fill="#05070b" opacity="0.28" />
      <path d="M 220.21,207.38 C 216.56,214.62 206.11,218.17 196.86,215.32 L 128.38,194.21 C 119.14,191.36 114.59,183.18 118.23,175.94 L 145.21,122.35 C 148.85,115.11 159.30,111.56 168.55,114.41 L 237.03,135.52 C 246.28,138.37 250.83,146.55 247.18,153.79 Z" fill="#05070b" opacity="0.50" />
      <path d="M 127.37,148.09 C 125.09,153.77 128.81,159.86 135.89,162.05 L 195.44,180.40 C 202.89,182.70 211.31,179.83 214.24,174.00 L 237.70,127.40 C 239.04,124.73 239.05,121.77 237.71,119.10 L 246.52,136.68 C 248.09,139.81 248.09,143.28 246.51,146.41 L 219.39,200.30 C 215.95,207.13 206.08,210.49 197.34,207.80 L 128.49,186.57 C 120.19,184.01 115.83,176.87 118.50,170.21 Z" fill="url(#bodyGradM)" />
      <path d="M 214.24,174.00 C 211.31,179.83 202.89,182.70 195.44,180.40 L 135.89,162.05 C 128.44,159.75 124.78,153.16 127.72,147.33 L 151.17,100.73 C 154.11,94.90 162.53,92.03 169.98,94.33 L 229.52,112.68 C 236.98,114.98 240.64,121.57 237.70,127.40 Z" fill="url(#keyTopGrad)" stroke="#ffffff" stroke-width="1.5" />
      <!-- M の刻印（キートップ平面へアイソメトリック投影） -->
      <g transform="matrix(0.9304, 0.2868, -0.3665, 0.7282, 182.71, 137.37)">
        <path d="M -18.5,19.2 L -18.5,-19.2 L 0.0,11.8 L 18.5,-19.2 L 18.5,19.2" fill="none" stroke="#151921" stroke-width="9.8" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    </g>

    <!-- 背景タイルの内側リムライト -->
    <rect x="1.5" y="1.5" width="253" height="253" rx="52.5" fill="none" stroke="url(#bgBorder)" stroke-width="3" />
  </g>
</svg>
